# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ros2-app"
BBFILE_PATTERN_meta-ros2-app = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ros2-app = "6"

LAYERDEPENDS_meta-ros2-app = "core ros2-lyrical-layer"
LAYERSERIES_COMPAT_meta-ros2-app = "scarthgap"

# Some meta-ros recipes are backported from newer Yocto releases and use ${UNPACKDIR},
# which scarthgap does not define. On scarthgap, sources are unpacked into ${WORKDIR}.
UNPACKDIR ??= "${WORKDIR}"
